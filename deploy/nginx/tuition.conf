# /etc/nginx/sites-available/tuition.conf  (link it into sites-enabled)
# Replace school.example with your domain (decision D2). certbot fills in the certificate paths.

# Access log without query strings: portal links carry a signed token in "?t=".
log_format tuition '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                   '$status $body_bytes_sent $request_time';

# Per-IP limits in front of the application's own limits.
limit_req_zone $binary_remote_addr zone=tuition_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=tuition_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name school.example;
    server_tokens off;
    access_log /var/log/nginx/tuition.access.log tuition;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # Ubuntu 24.04 ships Nginx 1.24: "http2" goes on the listen line.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name school.example;
    server_tokens off;
    access_log /var/log/nginx/tuition.access.log tuition;

    ssl_certificate     /etc/letsencrypt/live/school.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/school.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:tuition_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Student and bank imports are up to 10 MB (as JSON); everything else up to 1 MB in the app.
    client_max_body_size 11m;
    client_body_timeout 30s;

    # Security headers (CSP, HSTS, frame options...) come from the application itself.

    location ~ ^/api/(auth/login|auth/2fa/verify|portal/login/) {
        limit_req zone=tuition_login burst=10 nodelay;
        include /etc/nginx/snippets/tuition-proxy.conf;
    }
    location /api/ {
        limit_req zone=tuition_api burst=40 nodelay;
        include /etc/nginx/snippets/tuition-proxy.conf;
    }
    location / {
        include /etc/nginx/snippets/tuition-proxy.conf;
    }
}
